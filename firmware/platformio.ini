; PlatformIO project for the E-Ink Quran / Islamic library reader firmware.
;
; Target: Elecrow CrowPanel ESP32-S3 E-Paper HMI board (ESP32-S3-WROOM-1,
; 8 MB flash, 8 MB PSRAM), fitted with a Good Display GDEY075T7 7.5" panel
; (800x480, UC8179) in place of its stock 5.79" one. The panel is driven by
; GxEPD2 -- see include/board/board_crowpanel_579.h.
;
; Layout note: sources are split across firmware/{src,drivers,storage,power,
; ui} to match the architecture in docs/architecture.md, so build_src_filter
; pulls the sibling directories in. Headers live in firmware/include, which
; PlatformIO puts on the include path automatically.

[platformio]
default_envs = crowpanel_579

[env:crowpanel_579]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3-WROOM-1 N8R8: 8 MB flash, 8 MB OCTAL PSRAM -------------------
; Confirmed on hardware: the self-test reported psram_total=8386263.
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; 921600 fails on this board.
upload_speed = 460800

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; GxEPD2_4G drives the GDEY075T7 in black/white and in 4 greys; it needs
; Adafruit GFX (which pulls in Adafruit BusIO). It is not in the PlatformIO
; registry, so it is pinned by commit. It defines the same class names as
; GxEPD2, so the two can never be in one build.
lib_deps =
    https://github.com/ZinggJM/GxEPD2_4G.git#de006169dba1d905f618d70423f0e1a9215b20c7
    adafruit/Adafruit GFX Library@1.12.6

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; The CrowPanel exposes UART0 through a CH340 USB-serial bridge rather
    ; than the S3's native USB, so serial goes over UART0, not USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Compiles out GxEPD2's own unstamped "_Update_Full : 1585000" lines; every
    ; firmware log line goes through drivers::Logf with a timestamp instead
    ; (include/drivers/serial_log.h), and the panel timings are in [epd] lines.
    -DDISABLE_DIAGNOSTIC_OUTPUT

; Applies to project sources only, not to the Arduino core.
build_src_flags = -Wall

build_src_filter =
    +<*>
    -<grey_test.cpp>
    +<../drivers/>
    +<../storage/>
    +<../power/>
    +<../ui/>
    +<../qpk/>
    +<../wifi/>
    +<../ble/>

; The unit tests under test/ are host tests; running them here would need the
; board attached. Use `pio test -e native`.
test_ignore = *

; ---------------------------------------------------------------------------
; 4-grey refresh experiment (src/grey_test.cpp). NOT the product build.
;
; GxEPD2_4G forces a full-screen black/white refresh on the first b/w update
; after a grey one, which would wipe a grey photo every minute. This build
; draws a grey test photo and then updates only the clock area in two
; candidate ways, so the panel itself can say which one keeps the greys:
;
;     pio run -e grey_test -t upload && pio device monitor
;
; Only grey_test.cpp is built; the result chose drivers::Epd750Display's
; window update (variant B1).
; ---------------------------------------------------------------------------
[env:grey_test]
extends = env:crowpanel_579
build_src_filter =
    -<*>
    +<grey_test.cpp>

; ---------------------------------------------------------------------------
; Host unit tests. All the logic they cover (debounce, rotary pulse decode,
; rotary coalescing, idle/sleep policy) is deliberately header-only and free
; of Arduino dependencies so it can run here.
;
; PlatformIO's native platform hardcodes gcc/g++, so this environment needs
; gcc or clang on PATH. With only MSVC available (typical on Windows), run
; `python scripts/run_host_tests.py` instead -- same tests, same file.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; Without this, `pio test` compiles only the test files and every suite fails
; to link against the gfx/qpk/ui sources selected below.
test_build_src = yes
; Only the host-safe sources. gfx, qpk, wifi, ble and all four ui/*.cpp
; screens carry no Arduino dependency, so ui/ is pulled in whole (2026-09-01:
; the last of the four, surah_picker_screen.cpp, used to be the only one
; cherry-picked in here -- now that library_screen.cpp/reader_screen.cpp/
; selftest_screen.cpp have tests too, itemizing them individually the same
; way would just be four lines instead of one for no benefit). storage/ is
; the opposite case and stays itemized: sd_storage.cpp genuinely has an
; Arduino SD dependency, so only its two host-safe files are named below
; rather than pulling in all of storage/.
build_src_filter =
    -<*>
    +<../drivers/gfx/>
    +<../qpk/>
    +<../wifi/>
    +<../ble/>
    +<../ui/>
    +<../storage/library_index.cpp>
    +<../storage/reading_progress.cpp>
    +<../storage/reset_log.cpp>
    +<../storage/bookmarks.cpp>
    +<../storage/verified_packages.cpp>
; No -std flag on purpose: this has to build with g++, clang++ and MSVC, and
; the code is plain C++11 which all three default to or exceed.
build_flags =
    -Iinclude
